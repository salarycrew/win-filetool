[package]
name = "filetool-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "win-filetool 코어 작업을 명령줄에서 실행하는 동반 도구(점검·자동화용)"

[[bin]]
name = "filetool-cli"
path = "src/main.rs"

[dependencies]
filetool-core = { path = "../core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "0.46.0", default-features = false }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
