[package]
name = "filetool-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "win-filetool 코어 작업을 명령줄에서 실행하는 동반 도구(점검·자동화용)"

[[bin]]
name = "filetool-cli"
path = "src/main.rs"

[build-dependencies]
# VC 런타임 정적 링크(앱과 같은 방식). MIT OR Apache-2.0 OR Zlib
static_vcruntime = "3.0.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
filetool-core = { path = "../core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "0.46.0", default-features = false }
# 0.3.0 W4: 결과를 JSON으로
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# 0.3.3 점검: 스크립트를 넣은 시험용 한글 파일 만들기(core와 같은 판)
cfb = "0.14"
flate2 = "1.1"
