[package]
name = "filetool-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 비의존 파일 도구 코어 (NFC 파일명, zip, PDF 페이지 작업)"

[dependencies]
# 2a 검색: dm: 날짜(지역 시각), 이름 검색(memchr)
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8.44"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
libwebp-sys = { version = "0.9.6", features = ["sse41"] }
lopdf = { version = "0.46.0", default-features = false }
# 0.3.0 PDF 편집: 암호 걸기용 무작위 키(AES-256 파일 키)
getrandom = "0.4.3"
# 0.3.0 PDF 편집: 한글 글꼴 부분 넣기(시스템 맑은 고딕 등 TrueType)
subsetter = { version = "0.2.6", default-features = false }
ttf-parser = "0.25.1"
memchr = "2.8.3"
# PDF → 이미지: PDFium을 실행 중에 불러온다(pdfium.dll은 exe 옆, scripts/fetch-pdfium.sh)
# 0.3.0 W2: Word 읽기·이미지 순서(docx/pptx/xlsx XML)
quick-xml = "0.42.0"
# 0.3.0 W4: 이름 바꾸기 정규식, 같은 파일 찾기 해시(SHA-256)
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
sha2 = "0.10.9"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
webp = { version = "0.3.1", default-features = false }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# 0.3.0 W1: 앱에 든 도구 묶음(tar + zstd) 풀기
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }
# 0.3.0 W6 한글: HWP 5 복합 파일(CFB, MIT) 읽기 + raw DEFLATE 풀기(flate2, MIT/Apache)
cfb = "0.14"
flate2 = "1.1"

[target.'cfg(windows)'.dependencies]
# 2a 검색: FindFirstFileExW, ReadDirectoryChangesW, 드라이브 종류
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Networking_WinHttp"] }
# 윈도 시작 시 실행(HKCU Run)
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
# 감시 잠금: 프로세스 단위 fcntl 잠금(flock은 fork한 자식이 붙잡을 수 있음)
libc = "0.2.191"

[target."cfg(not(windows))".dependencies]
# 2a 실시간 갱신(Linux·테스트용 inotify). Windows는 ReadDirectoryChangesW를 직접 쓴다(오버플로를 알아야 해서)
notify = { version = "8.2.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
