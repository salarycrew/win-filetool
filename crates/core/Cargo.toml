[package]
name = "filetool-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 비의존 파일 도구 코어 (NFC 파일명, zip, PDF 페이지 작업)"

[dependencies]
encoding_rs = "0.8.44"
lopdf = { version = "0.46.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
