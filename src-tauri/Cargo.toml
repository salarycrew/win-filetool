[package]
name = "win-filetool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "파일 도구 (Tauri 2 앱)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filetool-core = { path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# 2c: 빠른 검색 서비스 설치/제거 단추(ShellExecuteExW runas)
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell"] }
